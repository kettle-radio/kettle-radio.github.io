<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A break from the news: BBC podcasts, stories and comedy, picked at random.">
<title>Put the Kettle On</title>
<link rel="canonical" href="https://kettle-radio.github.io/">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#2b3a33">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Put the Kettle On">
<meta property="og:title" content="Put the Kettle On">
<meta property="og:description" content="A break from the news: BBC podcasts, stories and comedy, picked at random.">
<meta property="og:url" content="https://kettle-radio.github.io/">
<meta property="og:image" content="https://kettle-radio.github.io/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Put the Kettle On: an FM radio dial">
<meta name="twitter:card" content="summary_large_image">
<script data-goatcounter="https://kettle.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..700,100&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}

/* Layout: one calm column; an old wireless set with an FM tuning dial, the chosen programme as its "now playing" card, genres below */
:root {
  --bg: #e5ebe3;
  --panel: #f6f8f3;
  --ink: #22302a;
  --muted: #5c6b63;
  --line: #c4cfc6;
  --glow: #b5651d;
  --glow-soft: #f3dcc2;
  --dial: #2b3a33;
  --dial-ink: #f1e6d4;
  --btn-ink: #ffffff;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131a17; --panel: #1b2420; --ink: #e8ece6; --muted: #9eaca4; --line: #2f3c36;
  --glow: #eaa25c; --glow-soft: #3a2a1b; --dial: #0d1210; --dial-ink: #f1e6d4; --btn-ink: #1d1209; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #131a17; --panel: #1b2420; --ink: #e8ece6; --muted: #9eaca4; --line: #2f3c36;
  --glow: #eaa25c; --glow-soft: #3a2a1b; --dial: #0d1210; --dial-ink: #f1e6d4; --btn-ink: #1d1209; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 32px 56px; }
.wrap { max-width: 36rem; margin: 0 auto; display: grid; gap: 28px; }
h1 { font-family: var(--display); font-variation-settings: "SOFT" 100; font-weight: 600; font-size: max(2.1rem, calc(min(100vw - 2.25rem, 36rem) / 8.4)); line-height: 1.05; white-space: nowrap; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
header { text-align: center; }
.lede { margin: 10px auto 0; color: var(--muted); font-size: clamp(1.06rem, calc(min(100vw - 2.25rem, 36rem) / 26), 1.4rem); text-wrap: balance; }

.set { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 18px; }

/* FM dial */
.dial { background: var(--dial); color: var(--dial-ink); border-radius: 10px; padding: 12px 14px 10px; position: relative; overflow: hidden; }
.dial .band { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 6px; }
.dial .band > span:first-child { opacity: .75; }
.dial .freq { font-family: var(--display); font-size: 1.05rem; letter-spacing: 0; text-transform: none; color: var(--glow); font-variant-numeric: tabular-nums; }
.scale { position: relative; height: 40px; }
.scale svg { display: block; width: 100%; height: 40px; }
.scale svg line { stroke: var(--dial-ink); }
.scale svg text { fill: var(--dial-ink); font: 11px var(--body); font-variant-numeric: tabular-nums; }
.needle { position: absolute; top: -4px; bottom: -2px; width: 2px; margin-left: -1px; background: var(--glow); box-shadow: 0 0 10px var(--glow); left: 30%; transition: left .9s cubic-bezier(.25,1.2,.4,1); }
@media (prefers-reduced-motion: reduce) { .needle { transition: none; } }

/* Programme card */
.prog { display: grid; gap: 6px; min-height: 9.5em; align-content: start; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.meta .genre { color: var(--glow); font-weight: 700; }
.show { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-top: 4px; }
.title { font-family: var(--display); font-variation-settings: "SOFT" 100; font-weight: 600; font-size: clamp(1.35rem, 5vw, 1.7rem); line-height: 1.2; margin: 0; text-wrap: balance; }
.syn { margin: 2px 0 0; max-width: 58ch; }

.actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.go { grid-column: 1 / -1; justify-content: center; display: inline-flex; align-items: center; gap: 10px; background: var(--glow); color: var(--btn-ink); text-decoration: none; font-weight: 700; padding: 13px 22px; border-radius: 999px; }
.go:hover { filter: brightness(1.06); }
.go[aria-disabled="true"] { opacity: .45; pointer-events: none; }
.reroll { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 11px 8px; font: inherit; font-size: 15px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.reroll:hover { border-color: var(--ink); background: var(--glow-soft); }
a:focus-visible, button:focus-visible { outline: 3px solid var(--glow); outline-offset: 3px; }

[hidden] { display: none !important; }

/* Filter groups */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--muted); background: var(--panel); }
.chip[aria-pressed="false"] { text-decoration: line-through; opacity: .6; }

</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Put the Kettle On</h1>
    <p class="lede">A break from the news: BBC podcasts, stories and comedy, picked at random.</p>
  </header>

  <section class="set" aria-label="Your programme">
    <div class="dial">
      <div class="band"><span>FM · MHz</span><span class="freq" id="freq">93.4</span></div>
      <div class="scale" aria-hidden="true">
        <svg id="scaleSvg" viewBox="0 0 400 40" preserveAspectRatio="none"></svg>
        <div class="needle" id="needle"></div>
      </div>
    </div>

    <div class="prog" aria-live="polite">
      <div class="meta"><span class="genre" id="genre"></span><span id="dur"></span><span id="net"></span><span id="year"></span></div>
      <div class="show" id="show"></div>
      <h2 class="title" id="title">Tuning in…</h2>
      <p class="syn" id="syn"></p>
    </div>

    <div class="actions">
      <a class="go" id="go" href="https://www.bbc.co.uk/sounds" target="_blank" rel="noopener">▶ Listen on BBC Sounds</a>
      <button class="reroll" id="reroll" type="button">Try another</button>
      <button class="reroll" id="share" type="button">Share</button>
      <button class="reroll" id="filterToggle" type="button" aria-expanded="false" aria-controls="filterPanel">Filter</button>
    </div>
    <div class="chips" id="filterPanel" hidden></div>
  </section>

</div>

<script>
// Eight broad groups, built from the BBC's sixteen genres
const GROUPS = {
  "Stories & Drama": ["drama", "audiobooks"],
  "Comedy": ["comedy"],
  "History": ["factual-history"],
  "Science & Nature": ["factual-scienceandnature"],
  "Arts & Ideas": ["factual-artscultureandthemedia", "religionandethics"],
  "Life Stories": ["factual-lifestories", "factual-familiesandrelationships", "factual-disability"],
  "Documentaries & Crime": ["documentaries", "factual-crimeandjustice-truecrime"],
  "Food, Travel & Living": ["factual-foodanddrink", "factual-travel", "factual-homesandgardens", "factual-healthandwellbeing"],
};
const LABELS = {};
for (const [name, ids] of Object.entries(GROUPS)) for (const id of ids) LABELS[id] = name;
// [genre, episode pid, show, episode title, synopsis, minutes, station, year]
const EPS = /*EPISODES*/[];

// FM scale 88–108 MHz
(function drawScale() {
  const svg = document.getElementById("scaleSvg"); let s = "";
  for (let f = 880; f <= 1080; f += 5) {
    const x = 10 + (f - 880) / 200 * 380, major = f % 40 === 0, mid = f % 10 === 0;
    s += `<line x1="${x}" x2="${x}" y1="${major ? 18 : mid ? 24 : 29}" y2="38" stroke-width="${major ? 1.4 : 0.8}" opacity="${major ? 0.9 : 0.5}"/>`;
    if (major) s += `<text x="${x}" y="12" text-anchor="middle">${f / 10}</text>`;
  }
  svg.innerHTML = s;
})();

const $ = id => document.getElementById(id);
const go = $("go");
let last = null;
function freqFor(pid) { let h = 0; for (const c of pid) h = (h * 31 + c.charCodeAt(0)) >>> 0; return 88 + (h % 200) / 10; }
function spin(chosen) {
  const today = new Date().toISOString().slice(0, 10);
  const pool = EPS.filter(e => (!e[8] || e[8] > today) && on.has(LABELS[e[0]]));
  if (!pool.length && !chosen) {
    go.setAttribute("aria-disabled", "true");
    for (const id of ["genre", "dur", "net", "year", "show", "syn"]) $(id).textContent = "";
    $("title").textContent = "Turn on at least one group under Filter"; return;
  }
  go.removeAttribute("aria-disabled");
  let e = chosen; if (!e) do { e = pool[Math.floor(Math.random() * pool.length)]; } while (pool.length > 1 && last && e[1] === last[1]);
  last = e;
  const [g, pid, show, ep, syn, minsRaw, net, year] = e;
  const mins = +minsRaw;
  go.href = "https://www.bbc.co.uk/sounds/play/" + pid;
  $("genre").textContent = LABELS[g];
  $("dur").textContent = mins >= 60 ? `${Math.floor(mins / 60)} hr ${mins % 60 ? (mins % 60) + " min" : ""}`.trim() : mins + " min";
  $("net").textContent = net ? "BBC " + net.replace(/^BBC /, "") : "";
  $("year").textContent = year || "";
  $("show").textContent = show;
  const weak = !ep || ep === show || /^(series \d+|episode \d+|\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4}|\d{1,2} \w+ \d{4})$/i.test(ep);
  $("title").textContent = weak ? show : ep;
  $("show").textContent = weak ? "" : show;
  $("syn").textContent = syn;
  const f = freqFor(pid);
  $("freq").textContent = f.toFixed(1);
  $("needle").style.left = ((10 + (f - 88) / 20 * 380) / 400 * 100) + "%";
  try { history.replaceState(null, "", "#" + pid); } catch (err) {}
}

// A shared programme that has since left the list: show a simple card that still links to it
function showShared(pid) {
  last = null;
  go.removeAttribute("aria-disabled");
  go.href = "https://www.bbc.co.uk/sounds/play/" + pid;
  for (const id of ["genre", "dur", "net", "year", "show"]) $(id).textContent = "";
  $("genre").textContent = "Shared with you";
  $("title").textContent = "A programme someone picked for you";
  $("syn").textContent = "Press Listen to hear it on BBC Sounds, or try another.";
  const f = freqFor(pid);
  $("freq").textContent = f.toFixed(1);
  $("needle").style.left = ((10 + (f - 88) / 20 * 380) / 400 * 100) + "%";
}

function count(name) { try { window.goatcounter && window.goatcounter.count({ path: name, title: name, event: true }); } catch (err) {} }
go.addEventListener("click", ev => {
  if (go.getAttribute("aria-disabled")) { ev.preventDefault(); return; }
  count("listen");
  setTimeout(() => spin(), 60);
});
$("reroll").addEventListener("click", () => spin());

// Share: phone share sheet where available, otherwise copy the link
const shareBtn = $("share");
shareBtn.addEventListener("click", async () => {
  const pid = (location.hash || "").slice(1);
  const url = "https://kettle-radio.github.io/" + (pid ? "#" + pid : "");
  const title = $("title").textContent;
  const text = title ? `${title}: found on Put the Kettle On` : "Put the Kettle On";
  count("share");
  if (navigator.share) {
    try { await navigator.share({ title: "Put the Kettle On", text, url }); } catch (err) {}
    return;
  }
  try { await navigator.clipboard.writeText(url); shareBtn.textContent = "Link copied"; }
  catch (err) { shareBtn.textContent = "Copy failed"; }
  setTimeout(() => { shareBtn.textContent = "Share"; }, 1800);
});

// Filter (remembered on this device only)
const groupNames = Object.keys(GROUPS);
let on = new Set(groupNames);
try {
  const saved = JSON.parse(localStorage.getItem("kettle-groups") || "null");
  if (Array.isArray(saved)) { const ok = saved.filter(n => groupNames.includes(n)); if (ok.length) on = new Set(ok); }
} catch (e) {}
const panel = $("filterPanel"), toggle = $("filterToggle");
function syncFilter() {
  for (const b of panel.children) b.setAttribute("aria-pressed", on.has(b.dataset.g) ? "true" : "false");
  toggle.textContent = on.size === groupNames.length ? "Filter" : `Filter · ${on.size}`;
  try { localStorage.setItem("kettle-groups", JSON.stringify([...on])); } catch (e) {}
}
groupNames.forEach((name, i) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.id = "group-" + i; b.dataset.g = name; b.textContent = name;
  b.addEventListener("click", () => { on.has(name) ? on.delete(name) : on.add(name); syncFilter(); spin(); });
  panel.appendChild(b);
});
toggle.addEventListener("click", () => {
  panel.hidden = !panel.hidden;
  toggle.setAttribute("aria-expanded", String(!panel.hidden));
});
syncFilter();

// Open on a shared programme if the link has one, e.g. kettle-radio.github.io/#b0b0v37m
const wanted = (location.hash || "").slice(1);
if (/^[a-z0-9]{8}$/.test(wanted)) {
  const hit = EPS.find(e => e[1] === wanted);
  if (hit) spin(hit); else showShared(wanted);
} else {
  spin();
}
</script>

</body>
</html>
